[package]
name = "swarn-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "swarnd"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
futures-util = "0.3.34"
mdns-sd = "0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
swarn-core = { version = "0.1.0", path = "../swarn-core", features = ["local-client"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "process", "time"] }
tokio-tungstenite = "0.30"
toml = "1.1.8"
ulid = "3.0.0"

[dev-dependencies]
base64 = "0.23"
p256 = { version = "0.14", features = ["ecdsa"] }
tempfile = "3.27.0"
tungstenite = "0.30.0"
