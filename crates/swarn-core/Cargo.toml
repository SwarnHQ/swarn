[package]
name = "swarn-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Blocking client for the daemon's Unix socket. Off by default so the mobile build stays I/O-free.
local-client = []

[dependencies]
base64 = "0.23"
ciborium = "0.2"
ed25519-dalek = "3"
getrandom = "0.4"
hpke = { version = "0.15", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
p256 = { version = "0.14", features = ["ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.154"
sha2 = "0.11"

