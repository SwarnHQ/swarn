[package]
name = "swarn-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[features]
# Blocking client for the daemon's Unix socket. Off by default so the mobile build stays I/O-free.
local-client = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
