[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Published snapshot of Zed's gpui (zed@93d7456). gpui-component 0.7 builds on the
# same crate, so adding widgets later does not pull in a second gpui.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit"] }
