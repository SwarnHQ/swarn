name: Bug report
description: Something in Swarn doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start swarnd
        2. ...
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "swarnd 0.1.0, or a commit hash"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 27.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output from swarnd, if any. Remove anything private first.
      render: text
