name: Feature request
description: Suggest something Swarn should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do when you wished Swarn did this?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Rough is fine.
